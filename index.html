<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>UMA-NIGHT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
body{display:flex;align-items:center;justify-content:center;font-family:var(--fm)}
@font-face{font-family:'Fusion Pixel';src:url('fonts/fusion-pixel-12px-sc.woff2') format('woff2');font-display:swap}
:root{--u:4px;--fh:"Fusion Pixel","PingFang SC","Microsoft YaHei",sans-serif;--fm:'Fusion Pixel','Courier New',monospace}
#stage{position:relative;background:#000;cursor:grab}
#stage.drag{cursor:grabbing}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0;pointer-events:none;color:#d8d8dc;text-shadow:1px 1px 0 #000;display:none}
#hud.on{display:block}
.pe{pointer-events:auto}
#tTime{position:absolute;top:calc(var(--u)*3);right:calc(var(--u)*3.4);font-size:calc(var(--u)*3.6)}
#tNight{position:absolute;top:calc(var(--u)*8);right:calc(var(--u)*3.4);font-size:calc(var(--u)*1.9);color:#93939d;font-family:var(--fh)}
/* ---- 批次7 §7.0 工控面板令牌：结构底/结构线/静默字/可用字/告警/致命（不新增色值） ---- */
#alertDot{position:absolute;top:calc(var(--u)*3);left:50%;transform:translateX(-50%);width:calc(var(--u)*2);height:calc(var(--u)*2);background:#6a7480;box-shadow:0 0 0 1px #3a3a48}
#alertDot.on{background:#ffd24a;box-shadow:0 0 0 1px #ffd24a}
#alertDot.crit{background:#e04848;box-shadow:0 0 0 1px #e04848}
#jukeGauge{position:absolute;top:calc(var(--u)*11.5);right:calc(var(--u)*3.4);display:none;align-items:stretch;height:calc(var(--u)*8);background:#2c2c34;border:1px solid #3a3a48;color:#6a7480;opacity:.5;padding:0;cursor:pointer;font-family:var(--fh);z-index:4;transition:opacity .18s,color .18s,border-color .18s,box-shadow .18s}
#jukeGauge .jgIco{display:block;width:calc(var(--u)*4);height:calc(var(--u)*7);margin:calc(var(--u)*0.5) calc(var(--u)*1.6);shape-rendering:crispEdges}
#jukeGauge .jgIco rect{fill:currentColor}
#jukeGauge .jgSep{width:1px;align-self:stretch;background:#3a3a48}
#jukeSec{min-width:calc(var(--u)*6);text-align:right;padding:0 calc(var(--u)*1.6);font-size:calc(var(--u)*3);line-height:calc(var(--u)*8);letter-spacing:1px;font-variant-numeric:tabular-nums;font-family:var(--fm)}
#jukeGauge:hover{opacity:1}
#jukeGauge.hot{opacity:1;color:#ffd24a;border-color:#ffd24a;box-shadow:0 0 0 1px #ffd24a inset}
#jukeGauge.ok{opacity:1;color:#d8e4ea;border-color:#d8e4ea;box-shadow:0 0 0 1px #d8e4ea inset}
@media (pointer:coarse){#jukeGauge{height:calc(var(--u)*10)}#jukeSec{line-height:calc(var(--u)*10);font-size:calc(var(--u)*3.6)}}
#powBox{position:absolute;left:calc(var(--u)*3);bottom:calc(var(--u)*3);font-size:calc(var(--u)*1.9);line-height:1.9}
#powBox b{color:#fff}
#staBox{position:absolute;left:calc(var(--u)*3);bottom:calc(var(--u)*10.5);font-size:calc(var(--u)*1.9);line-height:1.9}
.bar{position:relative;width:calc(var(--u)*24);height:calc(var(--u)*2);background:#14141c;border:1px solid #000;display:inline-block;vertical-align:-10%}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#3f7a3c;width:100%}
.bar.y i{background:#b99f2e}.bar.r i{background:#a02828}
#usage{display:inline-flex;gap:2px;vertical-align:middle}
#usage i{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);background:#20202a;border:1px solid #000}
#usage i.on{background:#e8e8ec}
#camStrip{position:absolute;left:50%;bottom:0;transform:translateX(-50%);padding:calc(var(--u)*1.4) calc(var(--u)*5);border:1px solid rgba(255,255,255,.45);border-bottom:none;background:rgba(0,0,0,.55);color:#e8e8e8;font-size:calc(var(--u)*2);letter-spacing:2px;white-space:nowrap;cursor:pointer}
#camStrip:active{background:rgba(255,255,255,.15)}
.arw{position:absolute;top:38%;font-size:calc(var(--u)*7);color:rgba(255,255,255,.4);padding:calc(var(--u)*2);cursor:pointer}
#arL{left:calc(var(--u)*.6)}#arR{right:calc(var(--u)*.6)}
#camHud{position:absolute;inset:0;display:none}
#camHud.on{display:block}
#camTitle{position:absolute;top:calc(var(--u)*3);left:calc(var(--u)*3.4);font-size:calc(var(--u)*2.2)}
#camSub{position:absolute;top:calc(var(--u)*7);left:calc(var(--u)*3.4);font-size:calc(var(--u)*1.8);color:#8a9a6a;font-family:var(--fh)}
#rec{position:absolute;top:calc(var(--u)*3);right:calc(var(--u)*15);font-size:calc(var(--u)*2);color:#cdd0c6;font-family:var(--fm);letter-spacing:1px}
#rec i{display:inline-block;width:calc(var(--u)*2);height:calc(var(--u)*2);background:#e04848;margin-right:calc(var(--u)*1.4);vertical-align:-8%}
#map{position:absolute;right:calc(var(--u)*2);bottom:calc(var(--u)*2);width:calc(var(--u)*22);height:calc(var(--u)*16);background:#000;border:1px solid #d8d8dc}   /* A-84 原生幅面 + 用户指令：黑底白线 */
#map .mb{position:absolute;border:1px solid #d8d8dc;background:rgba(255,255,255,.06);color:#e8e8e8;font-size:calc(var(--u)*1.6);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--fm)}
@media (pointer:coarse){#map .mb{font-size:calc(var(--u)*2.1)}}   /* 移动端命中区字号放大 */
#map .mb.on{background:#e8e8e8;color:#000}
#map .mb.alert{border-color:#fff;background:rgba(255,255,255,.28);color:#fff}   /* 单色提亮：告警=更亮的白，不用彩色、不闪烁 */
#map .you{position:absolute;border:1px solid #d8d8dc;color:#c9c9cf;font-size:calc(var(--u)*1.3);display:flex;align-items:center;justify-content:center;font-family:var(--fh);background:rgba(255,255,255,.04)}   /* 训练员室=矩形（不可点，与房间块同边但更淡） */
#blackHud{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:calc(var(--u)*9);color:#5a5a66}
#blackHud.on{display:flex}
#dbg{position:absolute;top:calc(var(--u)*12);left:calc(var(--u)*3);font:calc(var(--u)*1.7)/1.7 var(--fm);color:#7de07d;background:rgba(0,0,0,.6);padding:calc(var(--u)*1.2);white-space:pre;display:none;text-shadow:none}
#dbg.on{display:block}
#edgeFx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s}
#edgeFx.red{opacity:1;box-shadow:inset 0 0 calc(var(--u)*10) rgba(200,30,30,.55);animation:br .9s ease-in-out infinite}
#edgeFx.white{opacity:1;box-shadow:inset 0 0 calc(var(--u)*10) rgba(220,220,200,.5);animation:br 2s ease-in-out infinite}
@keyframes br{50%{opacity:.5}}   /* A-86 唯一保留的呼吸例外：致命倒计时语义 */
.ovl{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;color:#d8d8dc;text-align:center;z-index:5}
.ovl.on{display:flex}
/* ---- A-85 面板单元：主菜单 / 说明页 / 结算页 / intro 共用 §7.0 令牌，不新增颜色 ---- */
.gauge{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1);justify-content:center;margin:calc(var(--u)*1.2) 0}
.gauge .g{background:#2c2c34;border:1px solid #3a3a48;padding:calc(var(--u)*.7) calc(var(--u)*1.4);text-align:left;min-width:calc(var(--u)*9)}
.gauge .g span{display:block;font-family:var(--fm);font-size:calc(var(--u)*1.5);color:#6a7480;letter-spacing:1px}
.gauge .g b{display:block;font-family:var(--fm);font-size:calc(var(--u)*2.4);color:#cdd0c6;font-variant-numeric:tabular-nums}
.hrow{display:grid;grid-template-columns:calc(var(--u)*13) 1fr;gap:calc(var(--u)*1.6);align-items:baseline;padding:calc(var(--u)*.6) 0;border-bottom:1px solid #3a3a48;text-align:left}
.hk{font-family:var(--fm);font-size:calc(var(--u)*1.7);color:#6a7480;letter-spacing:1px}
.hv{font-family:var(--fh);font-size:calc(var(--u)*1.9);color:#cdd0c6;line-height:1.8}
.hrow.hcap .hk,.hrow.hcap .hv{color:#6a7480;font-family:var(--fm);font-size:calc(var(--u)*1.5);letter-spacing:2px}
.mbtn{pointer-events:auto;background:none;border:none;color:#c9c9cf;font-family:var(--fh);font-size:calc(var(--u)*3);padding:calc(var(--u)*1.2) calc(var(--u)*2);cursor:pointer;letter-spacing:2px;transition:border-color .15s,color .15s}
.mbtn:hover,.mbtn:active{color:#fff;border-color:#6a7480}
.mbtn.primary{color:#e8e8e8;font-size:calc(var(--u)*3.6)}   /* 用户指令：标题页与二级界面一律不留背景框，主项只用亮度区分；2026-09-20 用户追加：主项字号抬到 3.6u（审查位越界代改一次） */
#ovMenu{align-items:flex-start;justify-content:center;padding-left:8%;gap:calc(var(--u)*1)}
#mTitle{font-size:calc(var(--u)*3.2);line-height:1.7;color:#e8e8e8;text-align:left;margin-bottom:calc(var(--u)*2.6)}
#mTitle span{display:block;font-family:var(--fh);font-size:calc(var(--u)*1.8);color:#6a7480;letter-spacing:6px;margin-top:calc(var(--u)*1.6)}
#ovNights{align-items:flex-start;justify-content:center;padding-left:8%;gap:calc(var(--u)*1.2)}
#nightsTitle{font-family:var(--fm);font-size:calc(var(--u)*2);color:#6a7480;letter-spacing:3px}
#mNights{display:grid;grid-template-columns:repeat(4,auto);gap:calc(var(--u)*.8) calc(var(--u)*1.2);margin-bottom:calc(var(--u)*1.2)}
.nbtn{font-size:calc(var(--u)*2.4);padding:calc(var(--u)*.9) calc(var(--u)*1.8);color:#cdd0c6;letter-spacing:1px}
.nbtn.lock{opacity:.32;pointer-events:none}
#mSub{display:flex;gap:calc(var(--u)*1.2);flex-wrap:wrap;align-items:center}
#nightsSub{display:flex;gap:calc(var(--u)*1.2);align-items:center}
.mini{font-size:calc(var(--u)*1.9);color:#6a7480;padding:calc(var(--u)*.7) calc(var(--u)*1.2);letter-spacing:1px}
.mini:hover,.mini:active{color:#cdd0c6;border-color:#6a7480}
#mFoot{position:absolute;bottom:calc(var(--u)*2.4);left:calc(var(--u)*2.4);font-family:var(--fh);font-size:calc(var(--u)*1.5);color:#5c5c64}
#ovHow .box,#ovLog .box,#ovArch .box{background:#2c2c34;border:1px solid #3a3a48;padding:calc(var(--u)*4) calc(var(--u)*5);max-width:88%;font-family:var(--fh);font-size:calc(var(--u)*2);line-height:2;text-align:left;max-height:86%;overflow:auto}
.box h3{font-family:var(--fm);font-size:calc(var(--u)*2.4);margin-bottom:calc(var(--u)*2.4);color:#cdd0c6}
.arow{font-family:var(--fh);font-size:calc(var(--u)*2);line-height:2.1;color:#8a8a92;text-align:left}
.arow.got{color:#c9c9cf}
/* A-85 intro：左对齐「开机自检」面板单元，两行读数 + 一条自左向右走完的 1px 进度线（零旁白文字） */
#ovIntro{background:#000;align-items:flex-start;justify-content:center;padding-left:8%}
#inPanel{min-width:calc(var(--u)*24)}   /* A-90：intro 属纯信息 ⇒ 无底无框 */
#inTime{font-family:var(--fm);font-size:calc(var(--u)*2.8);color:#cdd0c6;letter-spacing:2px}
#inNight{font-family:var(--fm);font-size:calc(var(--u)*2);color:#6a7480;letter-spacing:3px;margin-top:calc(var(--u)*.6)}
#inProg{position:relative;height:1px;background:#3a3a48;margin-top:calc(var(--u)*1.6)}
#inProg i{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffd24a;display:block}
#inProg.run i{animation:rp 3.2s linear forwards}
@keyframes rp{to{width:100%}}
#ovDone{background:rgba(0,0,0,.9)}
#dnTitle{font-size:calc(var(--u)*5);margin-bottom:calc(var(--u)*3);color:#fff}
#dnSub{font-family:var(--fh);font-size:calc(var(--u)*2.2);line-height:2.2;color:#c9c9c0;margin-bottom:calc(var(--u)*4)}
#ovOver{background:rgba(0,0,0,.92)}
#goT{font-size:calc(var(--u)*5.4);letter-spacing:8px;color:#d8d8de;margin-bottom:calc(var(--u)*2.6)}
#goLine{width:calc(var(--u)*40);height:1px;background:#262c36;margin-bottom:calc(var(--u)*2.4)}
#goTag{font-family:var(--fh);font-size:calc(var(--u)*1.8);color:#7a8494;letter-spacing:2px;margin-bottom:calc(var(--u)*1.8);min-height:calc(var(--u)*2)}
#goS{font-family:var(--fh);font-size:calc(var(--u)*1.9);line-height:2.1;color:#8a8a92;margin-bottom:calc(var(--u)*4.5)}
.btnrow{display:flex;gap:calc(var(--u)*2);flex-wrap:wrap;justify-content:center}
#errBox{position:fixed;top:0;left:0;right:0;background:#3a0d0d;color:#ffb0b0;font:12px 'Fusion Pixel',monospace;padding:4px 8px;z-index:99;white-space:pre-wrap;display:none}
/* ---- P2：SYS LOG 归档 / 答录机 / 紧急评估 / 彩蛋 ---- */
/* SYS 日志条目样式（记录页归档用；游戏内面板已移除） */
.lgAt{color:#5a7a88;font-size:calc(var(--u)*1.5);margin-top:calc(var(--u)*1)}
.lgSys{color:#b8d0d8;font-family:var(--fm);font-size:calc(var(--u)*1.8);line-height:1.8;white-space:pre-wrap}
.lgNote{color:#d8b84a;font-family:var(--fh);font-size:calc(var(--u)*1.8);line-height:1.8;white-space:pre-wrap}
/* 录音机（v1.8 重构）：右下角「电话残留」同款字幕（固定 0.75 缩放），一次 1-2 行滑窗，播中红点闪烁 */
#answBox{position:absolute;top:calc(var(--u)*2);left:calc(var(--u)*2);transform:scale(.75);transform-origin:left top;max-width:84%;width:max-content;background:rgba(0,0,0,.72);border-left:2px solid #6a6f60;padding:calc(var(--u)*1.2) calc(var(--u)*2.4);text-align:left;font-family:var(--fh);font-size:calc(var(--u)*2.2);color:#cdd0c6;opacity:0;transition:opacity .5s;pointer-events:none}
#answBox.on{opacity:1;pointer-events:none}
#answDot{position:absolute;top:calc(var(--u)*1.5);right:calc(var(--u)*1.6);width:calc(var(--u)*2);height:calc(var(--u)*2);background:#ffd24a}
#answBody{line-height:2;white-space:pre-wrap;min-width:calc(var(--u)*40)}
#answBody div{opacity:.06;transition:opacity 1s}
#answBody div.rl{color:#ff6a6a}   /* D44 补裁2（审查位直改）：日记规则教学行红字——「日记=说明书」的视觉高亮 */
#reevalTag{position:absolute;top:calc(var(--u)*13.5);left:50%;transform:translateX(-50%);font-family:var(--fm);font-size:calc(var(--u)*2.1);letter-spacing:3px;color:#ff6060;display:none;animation:gl .34s steps(2) infinite}
#reevalTag.on{display:block}
/* A-95：广场监视时长越限——全屏标题浮层（裁决⑧：原话 + 现成 @keyframes gl 抖动，星号位由 JS 在 ＊/▓/█ 间跳动） */
#watchTitle{position:absolute;inset:0;display:none;background:rgba(0,0,0,.86);z-index:6;pointer-events:none}
#watchTitle.on{display:block}
#wtTitle{position:absolute;left:50%;top:42%;transform:translateX(-50%);white-space:nowrap;font-family:var(--fm);font-size:calc(var(--u)*5.4);letter-spacing:4px;color:#e8e8ec;animation:gl .34s steps(2) infinite}
#wtSub{position:absolute;left:50%;top:56%;transform:translateX(-50%);white-space:nowrap;font-family:var(--fm);font-size:calc(var(--u)*1.9);letter-spacing:2px;color:#7a8494}
#goT.wtjit{animation:gj .34s steps(2) infinite}
@keyframes gj{0%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(1px,1px)}}   /* 同 gl 的抖动量，但不含 -50% 位移（#goT 由 flex 居中） */
@keyframes gl{0%{transform:translateX(-50%) translate(0,0)}25%{transform:translateX(-50%) translate(-1px,1px)}50%{transform:translateX(-50%) translate(1px,-1px)}75%{transform:translateX(-50%) translate(-1px,-1px)}100%{transform:translateX(-50%) translate(1px,1px)}}
#eggFx{position:absolute;right:5%;bottom:22%;font-family:var(--fh);font-size:calc(var(--u)*2.2);color:#e0d8c8;opacity:0;transition:opacity 2.4s;text-shadow:1px 1px 0 #000;pointer-events:none}
#eggFx.on{opacity:.85}
#inRetry{font-family:var(--fh);font-size:calc(var(--u)*1.9);color:#6a6a72;margin-top:calc(var(--u)*2.4);letter-spacing:2px;min-height:calc(var(--u)*2.4)}
/* ---- P3：真结局 ---- */
#teBox{position:absolute;left:50%;bottom:calc(var(--u)*14);transform:translateX(-50%);max-width:80%;font-family:var(--fh);font-size:calc(var(--u)*2.3);line-height:2;color:#d8d8dc;background:rgba(0,0,0,.72);border-left:2px solid #7a8a9a;padding:calc(var(--u)*1.4) calc(var(--u)*2.4);text-align:left;opacity:0;transition:opacity .8s;white-space:pre-wrap}
#teBox.on{opacity:1}
#teRun{position:absolute;left:50%;top:56%;transform:translateX(-50%);pointer-events:auto;background:rgba(10,10,14,.8);border:1px solid #8a9aa8;color:#e8e8e8;font-family:var(--fh);font-size:calc(var(--u)*3.4);letter-spacing:6px;padding:calc(var(--u)*2) calc(var(--u)*6);cursor:pointer;display:none;overflow:hidden}
#teRun.on{display:block}
#teRunBar{position:absolute;left:0;bottom:0;height:calc(var(--u)*.9);width:0;background:#8fb0c8}
#teSkip{position:absolute;right:calc(var(--u)*2);bottom:calc(var(--u)*2);font-family:var(--fh);font-size:calc(var(--u)*1.5);color:#5a5a62}
#credits{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:60%;color:#c9c9cf;font-family:var(--fh);font-size:calc(var(--u)*2.2);line-height:2.4;text-align:center;pointer-events:none;animation:roll 14s linear forwards}
#credits.on{display:flex}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-160%)}}
</style>
</head>
<body>
<div id="errBox"></div>
<div id="stage">
<canvas id="cv" width="320" height="180"></canvas>
<div id="hud">
  <div id="tTime">12 AM</div><div id="tNight"></div>
  <div id="alertDot"></div>
  <div id="staBox">耐力 <b id="staPct">100%</b></div>
  <div id="powBox">电力 <b id="powPct">100%</b><br>用量 <span id="usage"><i></i><i></i><i></i><i></i></span></div>
  <div id="camHud"><div id="camTitle">CAM1 · 大厅</div><div id="camSub"></div><button id="jukeGauge" class="pe" title="续电" aria-label="续电"><svg class="jgIco" viewBox="0 0 8 8" width="16" height="16" shape-rendering="crispEdges"><rect x="4" y="0" width="3" height="1"/><rect x="3" y="1" width="3" height="1"/><rect x="2" y="2" width="5" height="1"/><rect x="4" y="3" width="3" height="1"/><rect x="3" y="4" width="3" height="1"/><rect x="2" y="5" width="3" height="1"/><rect x="1" y="6" width="2" height="1"/></svg><i class="jgSep"></i><span id="jukeSec">00</span></button><div id="rec"><i></i>REC</div><div id="map"></div></div>
  <div id="blackHud">10</div>
  <div id="dbg"></div>
  <div id="camStrip" class="pe">▲ 打开监控</div>
  <div id="arL" class="arw pe">‹</div><div id="arR" class="arw pe">›</div>
  <div id="edgeFx"></div>
  <div id="answBox"><i id="answDot"></i><div id="answBody"></div></div>
  <div id="reevalTag">RE-EVALUATING</div>
  <div id="watchTitle"><div id="wtTitle"></div><div id="wtSub"></div></div>
  <div id="eggFx"></div>
</div>
<div class="ovl on" id="ovMenu">
  <div id="mTitle">UMA-NIGHT<span id="mSubtitle">七 夜 · 值 班 记 录</span></div>
  <button class="mbtn primary" id="mPlay">继续游戏</button>

var drag=null;
stage.addEventListener('pointerdown',function(e){
 if(scene!=='game'||!S)return;
 if(e.target.closest('.ovl')||e.target.closest('.pe'))return;
 if(S.black)return;
  var r=cv.getBoundingClientRect();

  if(S.cams){return;}                                  /* A-83：画布内点唱机热点已撤销，续电唯一入口=仪表胶囊 */

   else S.close=0;
   return}
  var fp=flatAt(px,py),
      hitR=function(r){return fp.px>=r.x&&fp.px<=r.x+r.w&&fp.py>=r.y&&fp.py<=r.y+r.h};   /* 判定=与渲染同一张 OFFICE 表（flatAt 严格互逆） */

  if(hitR(OFFICE.doorL.lock)){toggleLock('L');return}

  if(hitR(OFFICE.doorR.lock)){toggleLock('R');return}
  if(hitR(OFFICE.doorR.light)){pressLight('R');return}
 if(e.pointerType==='mouse'){return}  /* 鼠标=跟随视角（无需拖拽） */
 drag={sx:e.clientX,sy:e.clientY,sp:S.panT,sv:S.vertT,id:e.pointerId};stage.classList.add('drag')});

 if(S&&scene==='game'&&!S.cams&&!S.close&&!S.black&&e.pointerType==='mouse'&&!drag){

  S.vertT=clamp((q.y-.5)*2*VERT_LIMIT,-VERT_LIMIT,VERT_LIMIT);
  return}
 if(!drag||e.pointerId!==drag.id||!S)return;
 var r=cv.getBoundingClientRect();
 S.panT=clamp(drag.sp-(e.clientX-drag.sx)*.0009,-PAN_LIMIT,PAN_LIMIT);
 S.vertT=clamp(drag.sv+(e.clientY-drag.sy)*.0002,-VERT_LIMIT,VERT_LIMIT)});

addEventListener('keydown',function(e){
 if(e.key==='F1'||e.key==='F2'||e.key==='F3'||e.key==='F4'||e.key==='F5'||e.key==='F6'||e.key==='F7'||e.key==='F8'||e.key==='F9'||e.key==='F10'||e.key==='F11')e.preventDefault();
 if(scene!=='game'||!S)return;
 var k=e.key.toLowerCase();
 if(k==='a'||k==='arrowleft')S.holdDir=-1;
 else if(k==='d'||k==='arrowright')S.holdDir=1;
 else if(k==='c')setCams(!S.cams);
 else if(k==='r')interruptDiary();                  /* 答录机中断无惩罚（A9） */
 else if(k==='f'){if(!S.cams)S.close=S.close?0:1}   /* 白板近看（A21 基础） */
 else if(k===' '){e.preventDefault()}               /* A-61 裁决④：彻底废除空格续电 */
 else if(k==='escape')setCams(false);
 else if(k==='q'){if(!e.repeat)toggleLock('L')}
 else if(k==='e'){if(!e.repeat)toggleLock('R')}
 else if(k==='z'&&!e.repeat){pressLight('L')}        /* A-35：灯独立键 */
 else if(k==='x'&&!e.repeat){pressLight('R')}
 else if(k==='f1'){S.power=clamp(S.power-10,0,100)}
 else if(k==='f2'){S.power=clamp(S.power+10,0,100)}
 else if(k==='f3'){S.sta=100;S.staLock=0}
 else if(k==='f4'){if(S.juke.started&&!S.juke.dead)S.juke.batt=Math.min(S.juke.batt,3)}
 else if(k==='f5'){if(!S.board.state)boardAppear(1)}
 else if(k==='f6'){var c=S.slots.C;if(c){c.active=1;c.idx=c.path.length-1;c.doorT=c.edgeKill||CFG.edge.t;c.knock=0;AU.moan(doorSide(c))}}
 else if(k==='f7'){for(var i=0;i<30&&scene==='game';i++)updateGame(1)}
 else if(k==='f8'){S.god=!S.god}
 else if(k==='f9'){S.time=e.shiftKey?Math.max(0,S.time-30):S.time+30}              /* A22 跳时 ±30s */
 else if(k==='f10'){if(!S.board.state)boardAppear(1);if(S.board.state===1)endBoard('draw')}   /* A22 直达白板局后（平局） */
 else if(k==='f11'){triggerVisit()}});

 if((k==='a'||k==='arrowleft'||k==='d'||k==='arrowright')&&S)S.holdDir=0});
/* ============ 主循环 ============ */
function loop(t){requestAnimationFrame(loop);
 var dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;DT=dt;frame++;
 if(frame%2===0)upNoise();
 cx.setTransform(SQ,0,0,SQ,0,0);                    /* 逻辑 384x216 → 画布 320x180 */
 tickHer();                                         /* A-105：BGM 通道按场景/开播态判定目标音量（含淡入淡出与重试） */
 if(scene==='game'&&S){
  var gdt=dt*SCALE;
  if(gdt>0)updateGame(gdt);
  if(scene==='game'){
   if(S.cams)renderCams();else renderOffice();
   renderPreFlash();                                  /* A-88：她的登场预告（办公室与监控两态皆可见） */
   if(S.cams&&S.camRoom==='hall'&&S.juke.started&&!S.juke.dead&&!S.juke.warn&&S.juke.left>0&&!herSongOn()){   /* A-105：夜7 集齐时合成八音盒让位给 mp3 通道 */
    S.juke.melT-=dt;
    if(S.juke.melT<=0){var n=JUKEMEL[S.juke.melI];
     if(n[0])AU.note(n[0],n[1]*.5,S.juke.left<10?.035:.045);
     S.juke.melT=n[1]*.5;
     S.juke.melI=(S.juke.melI+1)%JUKEMEL.length}}}
  hudT-=dt;if(hudT<=0){hudT=.12;updateHud()}}
 else if(scene==='jump'&&S){var rc=S.recycle,was=rc?rc.t:0;
  if(rc){rc.t+=dt;rc.gearT+=dt;
   if(rc.t>=.5&&rc.t<2.6&&rc.gearT>=.3){rc.gearT=0;if(AU.ctx)AU.gear()}   /* 删除进度冷音色 */
   renderJump();
   if(rc.t>4){showScene('over');
    var rs=META.result||{};
    paintOver(rc.tag,rc.msg+'<br><span style="color:#8a8a92">'+(rs.power||'电力')+' '+Math.max(0,Math.ceil(S.power))+'% · '+
     (rs.stamina||'耐力')+' '+Math.ceil(S.sta)+'% · '+(rs.renew||'续播')+' '+S.stats.renewals+'</span>')}}}
 else if(scene==='trueEnd'&&S){if(S.te)tickTrueEnd(dt);renderTrueEnd()}
 else if(scene==='over')renderOver();
 else if(scene==='done'){cx.fillStyle='#000';cx.fillRect(0,0,384,216);
  if(S&&S.finaleMel&&!herSongOn()){S.juke.melT-=dt;  /* 谢幕曲续播进结算界面（A12 finale）；A-105：夜7 集齐时由 mp3 续播 */
   if(S.juke.melT<=0){var nm=JUKEMEL[S.juke.melI];
    if(nm[0])AU.note(nm[0],nm[1]*.5,.03);
    S.juke.melT=nm[1]*.5;
    S.juke.melI=(S.juke.melI+1)%JUKEMEL.length}}}
 else if(scene==='menu'||scene==='how'||scene==='log'||scene==='arch'||scene==='load')renderMenu();
 else{cx.fillStyle='#000';cx.fillRect(0,0,384,216)}}

loadAssets(function(){META=getMeta();if(!officeImg())panoOK=0;try{bakeOfficePano()}catch(e){panoOK=0}buildMenu();buildMap();showScene('menu');
 /* ?night=N 直达该夜（绕过菜单门控，供调试/无头测试）；?at=H:MM 跳时；?pan=x 办公室视角（-0.28..0.28）
    ?smoke=1/2/3 无头烟雾 · 4 纯净夜通关链 · 6 真结局链（临时旗标，不入档）
    无头模式 rAF 时间戳不随 virtual-time 前进，故用定时器直接驱动 updateGame */
 var qs=new URLSearchParams(location.search);
 var nq=parseInt(qs.get('night'),10)||0;
 var smoke=qs.get('smoke');
 var atq=qs.get('at');
 var hitdbg=qs.get('hitdbg');
 if(nq>=1&&nq<=7){CUR=nq;startNight(CUR)}
 if(atq&&S)S.time=Math.max(0,parseClock(atq,N.hourLen));
 var godq=qs.get('god');if(godq&&S)S.god=1;

 var clq=qs.get('close');if(clq&&S)S.close=1;   /* 调试：直达白板近看 */
 var panq=qs.get('pan');if(panq!==null&&S){S.pan=S.panT=clamp(parseFloat(panq),-PAN_LIMIT,PAN_LIMIT);}
 if(smoke==='6'||smoke==='7'){
  if(smoke==='6')TRUTH_TEST=1;                      /* 6=真结局链（临时旗标判定）· 7=标准结局链（旗标不齐） */
  if(!S)startNight(CUR||7);
   for(var k6 in S.slots){S.slots[k6].at=99999;S.slots[k6].moveAt=99999}
   CFG.juke.start=99999}
  if(smoke){
   if(!S)startNight(CUR||3);
   setTimeout(function(){if(scene==='intro')enterGame();
    if(smoke==='3'){setCams(true,true);
     var camq=qs.get('cam');                              /* &cam=房间：无头验收指定监控位（如 cam=plaza 验 CAM7 纯雪花） */
     if(camq&&CAMORDER.indexOf(camq)>=0){S.camRoom=camq;S.camCd=0;
      $('camTitle').textContent=CAMNO[camq]+' · '+RN[camq];
      document.querySelectorAll('#map .mb').forEach(function(b){b.classList.toggle('on',b.dataset.r===camq)})}}},100);
   var jumpq=qs.get('jump');
   if(jumpq)setTimeout(function(){if(scene==='intro')enterGame();jump(jumpq,'无头调试跳杀','DEBUG-JUMP',jumpq==='shadow')},120);
   if(smoke==='2')for(var k in S.slots){S.slots[k].at=99999;S.slots[k].moveAt=99999}
   if(smoke==='4'){for(var k in S.slots){S.slots[k].at=99999;S.slots[k].moveAt=99999}CFG.board.at=99999;CFG.juke.start=99999}  /* 纯净夜：验证 06:00 通关链 */
   if(smoke==='8'){                                     /* A-95：plazaWatch 全链无人值守（驻留→关监控→标题→D 跳脸） */
    for(var k8 in S.slots){S.slots[k8].at=99999;S.slots[k8].moveAt=99999}
    CFG.board.at=99999;CFG.juke.start=99999;
    if(!CFG.plazaWatch)CFG.plazaWatch=3;               /* B-48 数据未落时给测试阈值，落了则用真值 */
    setTimeout(function(){if(S&&scene==='game'){setCams(true,true);S.camRoom='plaza';S.camCd=0}},400)}
  var autoDraw=(smoke==='6'||smoke==='7');
  setInterval(function(){
   if(scene==='game'&&S){
    if(S.panT!==S.pan)S.pan=S.panT;                     /* 无头：pan 即时到位（rAF 插值不走） */
   if(autoDraw&&S.board.state===1)endBoard('draw');   /* 白板出现即平局：直入挂起→真结局链（updateGame 自己会在 at 时开板） */
    updateGame(2);
    document.title=[scene,CUR,N.board.mode,S.board.state,Math.floor(S.time),'st'+S.time.toFixed(0)].join('|')}
   else if(scene==='jump'&&S&&S.recycle){S.recycle.t+=2;   /* 回收演出无头推进（rAF 不走虚拟时间） */
    if(S.recycle.t>4){showScene('over');paintOver(S.recycle.tag,S.recycle.msg)}}
   else if(scene==='trueEnd'&&S&&S.te){if(S.te.phase==='run')teProceed();tickTrueEnd(2)}},100)}});   /* 真结局演出无头推进（自动长按） */
/* 「跑吧。」长按 1.5s 确认（A18：同门锁阈值逻辑，鼠标/触屏同路径） */
(function(){var holdT=0,holdI=null,btn=$('teRun'),bar=$('teRunBar');
 function reset(){if(holdI){clearInterval(holdI);holdI=null}holdT=0;bar.style.width='0%'}
